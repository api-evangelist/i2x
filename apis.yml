name: i2x
description: >-
  i2x is a German real-time AI platform for contact centers, built by i2x GmbH in
  Mönchengladbach. It provides live agent assistance that surfaces contextual
  recommendations during calls in under 0.4 seconds, including automatic detection of
  purchase signals and faster agent onboarding; full-coverage call analysis with
  automatic transcription plus quality, compliance, and sales-opportunity scoring
  across 100% of conversations; and voicebots for automated inbound/outbound telephony
  and virtual agent-training scenarios. The platform emphasizes DSGVO/GDPR compliance
  with EU-only hosting in German data centers, prepared works-council documentation, and
  EU AI Act alignment, positioning itself as an alternative to US-cloud-dependent
  conversation-intelligence tools. i2x publishes no developer program: no API reference,
  no OpenAPI/AsyncAPI/GraphQL specification, no SDK on any package registry, no public
  GitHub organization, no MCP server, no agent card, no status page and no pricing — the
  only commercial entry point is a demo-request form. A private, login-gated API host does
  exist at api.eu.i2x.ai serving the customer web application at app.i2x.ai, but it is
  undocumented and is not offered as an integration surface. This profile was surfaced as
  a portfolio company of hv-capital.
