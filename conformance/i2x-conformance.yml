notes: >-
  No `type: Compliance` pointer is emitted in apis.yml. The compliance_published check asks
  whether the provider publishes a compliance PROGRAM; i2x publishes a bullet list of claims
  with no supporting artifact behind any of them. Recording the claims is useful; scoring
  them as a published program would credit i2x with a posture it has not documented.
